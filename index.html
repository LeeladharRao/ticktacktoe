<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" sizes="180x180" href="logo.png" />
  </head>
  <body>
    <div class="container">
      <div id="gameContainer">
        <h1 class="game-title">Tic Tac Toe</h1>
        <div class="game-info" id="rulesContainer">
          <p class="rules">
            Your oldest mark disappears when you make a 3rd move!
          </p>
        </div>

        <div class="players-container">
          <div class="player player-x active">
            <span class="player-icon">X</span>
            <span class="player-label">Player X</span>
          </div>
          <div class="player player-o">
            <span class="player-icon">O</span>
            <span class="player-label">Player O</span>
          </div>
        </div>

        <div id="cellContainer">
          <div cellIndex="0" class="cell"></div>
          <div cellIndex="1" class="cell"></div>
          <div cellIndex="2" class="cell"></div>
          <div cellIndex="3" class="cell"></div>
          <div cellIndex="4" class="cell"></div>
          <div cellIndex="5" class="cell"></div>
          <div cellIndex="6" class="cell"></div>
          <div cellIndex="7" class="cell"></div>
          <div cellIndex="8" class="cell"></div>
        </div>

        <h2 id="statusText" class="status-text">X's turn</h2>

        <button id="restartBtn" class="restart-btn">New Game</button>
      </div>
    </div>
    <script src="index.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
